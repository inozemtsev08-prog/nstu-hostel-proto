<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>НГТУ НЭТИ — АИС «Студгородок» (Прототип)</title>
  <style>
    :root {
      --green: #00a859;
      --green-dark: #008a49;
      --green-soft: #eefaf3;
      --red-brand: #e31e52;
      --amber: #e69500;
      --amber-bg: #fff8eb;
      --red: #d92d20;
      --red-bg: #fef3f2;
      --purple: #7c3aed;
      --purple-bg: #f5f3ff;
      --blue: #0b5ed7;
      --blue-bg: #eff6ff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --border-light: #e5e7eb;
      --bg-soft: #f8f9fa;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      background: var(--white);
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.35;
    }

    /* Top utility bar */
    .utility-bar {
      border-bottom: 1px solid var(--border-light);
      background: var(--white);
      padding: 5px 16px;
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      min-height: 33px;
    }
    .utility-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-shrink: 1;
      color: var(--muted);
    }
    .utility-left .accent {
      color: var(--red-brand);
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .utility-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .week-badge {
      background: #f5a623;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .role-perm {
      font-size: 11px;
      color: var(--muted);
      background: #f3f4f6;
      padding: 2px 7px;
      border: 1px solid var(--border-light);
      white-space: nowrap;
    }
    .role-select, .ctx-select {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 2px 6px;
      font-size: 11.5px;
      cursor: pointer;
    }
    .ctx-select { font-weight: 600; }
    #dormSelect { max-width: 335px; text-overflow: ellipsis; }

    /* Compact Header */
    .site-header {
      border-bottom: 1px solid var(--border-light);
      background: var(--white);
      padding: 7px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-text { font-size: 11px; color: #374151; line-height: 1.15; }
    .logo-text strong { display: block; font-size: 14px; color: #111827; letter-spacing: 0.4px; margin-top: 1px; }

    /* Horizontal Navigation Bar */
    .nav-bar {
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 2px;
    }
    .nav-btn {
      border: none;
      border-right: 1px solid var(--border-light);
      background: transparent;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: #1f2937;
      cursor: pointer;
    }
    .nav-btn:first-child { border-left: 1px solid var(--border-light); }
    .nav-btn:hover { background: #eef2f6; color: var(--blue); }
    .nav-btn.active {
      background: var(--green);
      color: #ffffff;
      font-weight: 700;
    }
    .nav-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 5px;
      background: #e5e7eb;
      color: #374151;
    }
    .nav-btn.active .nav-badge { background: rgba(255,255,255,0.25); color: #fff; }
    .nav-badge.warn { background: var(--red-bg); color: var(--red); }

    /* Main Content */
    .main { padding: 12px 16px; width: 100%; }
    .breadcrumbs { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .page-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border-light);
    }
    .page-title { font-size: 17px; font-weight: 700; color: #111827; }
    .page-desc { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 11px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: auto;
    }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--green-dark); }
    .btn-amber { background: #f5a623; color: #fff; }
    .btn-amber:hover:not(:disabled) { background: #dc8e12; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #b42318; }
    .btn-danger-outline { background: #fff; border-color: #f6b8b3; color: var(--red); }
    .btn-danger-outline:hover:not(:disabled) { background: var(--red-bg); }
    .btn-outline { background: #fff; border-color: var(--border); color: var(--text); }
    .btn-outline:hover:not(:disabled) { background: #f3f4f6; }
    .btn-xs { padding: 2px 7px; font-size: 11px; }

    /* Compact KPI strip */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border: 1px solid var(--border);
      background: #fafafa;
      margin-bottom: 10px;
    }
    .kpi-cell {
      padding: 6px 12px;
      border-right: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .kpi-cell:last-child { border-right: none; }
    .kpi-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
    .kpi-val { font-size: 17px; font-weight: 800; color: #111827; white-space: nowrap; }
    .kpi-sub { font-size: 11px; color: var(--muted); }

    /* Grids & Panels */
    .dash-grid { display: grid; grid-template-columns: 1.4fr 1.1fr; gap: 12px; align-items: start; }
    .quotas-grid { display: grid; grid-template-columns: 1.65fr 0.75fr; gap: 12px; align-items: start; }
    .sticky-panel { position: sticky; top: 12px; }
    .panel {
      border: 1px solid var(--border);
      background: #fff;
      margin-bottom: 10px;
    }
    .panel-head {
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border-light);
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .panel-body { padding: 9px 10px; }
    .scroll-box { max-height: 460px; overflow-y: auto; }

    /* Demo placeholder */
    .demo-empty {
      border: 1px dashed var(--border);
      background: var(--bg-soft);
      padding: 28px 20px;
      text-align: center;
      margin-top: 8px;
    }
    .demo-empty h2 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
    .demo-empty p { font-size: 12.5px; color: var(--muted); max-width: 600px; margin: 0 auto 14px; }

    /* Forecast controls */
    .fc-row {
      display: grid;
      grid-template-columns: 115px 1fr 62px;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .fc-checks {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 8px 0;
      padding: 7px 8px;
      background: #f9fafb;
      border: 1px solid var(--border-light);
      font-size: 11.5px;
    }
    .fc-checks label { display: flex; align-items: flex-start; gap: 6px; cursor: pointer; }
    .fc-checks input[type="checkbox"] { margin-top: 2px; }
    .fc-summary-table th, .fc-summary-table td { padding: 4px 6px; font-size: 11.5px; }

    /* Tags & Interactive Multi-Benefit Tooltip */
    .tag {
      display: inline-block;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .t-green { background: var(--green-soft); color: #067647; border-color: #a6e3be; }
    .t-amber { background: var(--amber-bg); color: #9a5b04; border-color: #f3d098; }
    .t-red { background: var(--red-bg); color: #b42318; border-color: #f6b8b3; }
    .t-purple { background: var(--purple-bg); color: #5b21b6; border-color: #ddd6fe; }
    .t-blue { background: var(--blue-bg); color: #1d4ed8; border-color: #bfd7fe; }
    .t-gray { background: #f3f4f6; color: #4b5563; border-color: #d1d5db; }

    .benefit-multi-wrap {
      position: relative;
      display: inline-block;
    }
    .benefit-multi-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: 600;
      background: var(--blue-bg);
      color: #1d4ed8;
      border: 1px solid #bfd7fe;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }
    .benefit-multi-btn:hover,
    .benefit-multi-wrap:focus-within .benefit-multi-btn {
      background: #e0ecff;
      border-color: #93c5fd;
    }
    .benefit-multi-count {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      font-size: 10px;
      font-weight: 700;
      padding: 0 4px;
      line-height: 1.25;
    }
    .benefit-popover {
      display: none;
      position: absolute;
      left: 0;
      top: calc(100% + 4px);
      z-index: 60;
      min-width: 220px;
      background: #111827;
      color: #fff;
      padding: 7px 10px;
      font-size: 11px;
      line-height: 1.4;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
      border: 1px solid #374151;
      text-align: left;
      white-space: normal;
    }
    .benefit-multi-wrap:hover .benefit-popover,
    .benefit-multi-wrap:focus-within .benefit-popover,
    .benefit-multi-wrap.open .benefit-popover {
      display: block;
    }
    .benefit-popover-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #9ca3af;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .benefit-popover ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .benefit-popover li {
      padding: 2px 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .benefit-popover li::before {
      content: "•";
      color: #60a5fa;
      font-weight: 700;
    }

    /* Dense Tables */
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    .input, .select {
      padding: 5px 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #fff;
      color: var(--text);
    }
    .input:focus, .select:focus { outline: 1px solid var(--green); border-color: var(--green); }
    .input-grow { flex: 1; min-width: 190px; }
    .date-mask-input {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 6px 7px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
      font-size: 12px;
      vertical-align: middle;
    }
    th {
      background: var(--bg-soft);
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tr.row-link { transition: background 0.1s; }
    tr.row-link:hover { background: #eef7f2; cursor: pointer; }
    tr.row-link .row-open-cue { color: var(--muted); font-size: 11px; font-weight: 600; }
    tr.row-link:hover .row-open-cue { color: var(--green-dark); text-decoration: underline; }

    /* Vertical stacked actions in Quotas table for clean column balance */
    .app-actions-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 112px;
      margin-left: auto;
    }
    .app-actions-stack .btn {
      width: 100%;
      justify-content: center;
      padding: 2px 6px;
    }

    /* Activity Rows */
    .act-row {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .act-row:last-child { border-bottom: none; }
    .act-row.prio-amber { border-left: 3px solid var(--amber); background: #fffdf7; }
    .act-row.prio-red { border-left: 3px solid var(--red); background: #fffafa; }
    .act-row-clickable {
      cursor: pointer;
      transition: background 0.12s;
    }
    .act-row-clickable:hover {
      background: #f1f5f9 !important;
    }
    .act-row-cue {
      font-size: 10.5px;
      color: var(--blue);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Floor Map */
    .blocks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(410px, 1fr)); gap: 10px; }
    .block-card { border: 1px solid var(--border); background: #fff; }
    .block-card.has-issue { border-color: #f3a69f; }
    .block-top {
      background: var(--bg-soft);
      padding: 5px 10px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .rooms-grid { padding: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 6px; }
    .room-card {
      border: 1px solid var(--border);
      padding: 6px 7px;
      background: #fafafa;
      cursor: pointer;
    }
    .room-card:hover { border-color: var(--green); }
    .room-card.is-free { background: #f5fbf7; border-color: #9ddcb7; }
    .room-card.is-repair { background: #fff8f8; border-color: #f3a69f; }
    .room-card.is-other-fac { background: #f9fafb; border-color: #e5e7eb; cursor: default; }
    .room-card.is-other-fac:hover { border-color: #e5e7eb; }
    .room-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 12px; margin-bottom: 4px; gap: 4px; }
    .beds { display: flex; flex-direction: column; gap: 3px; margin: 4px 0; }
    .bed {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 5px;
      border: 1px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bed-free { background: var(--green-soft); color: #067647; border-style: dashed; border-color: var(--green); }
    .bed-occ { background: #e5e7eb; color: #1f2937; }
    .bed-anon { background: #f3f4f6; color: #6b7280; border-color: #e5e7eb; font-weight: 500; }
    .bed-book { background: var(--amber-bg); color: #9a5b04; border-color: #f3d098; }
    .bed-risk { background: var(--purple-bg); color: #5b21b6; border-color: #c4b5fd; }
    .bed-rep { background: #fee4e2; color: #912018; text-decoration: line-through; }

    /* Progress */
    .bar-bg { height: 5px; background: #e5e7eb; overflow: hidden; margin-top: 3px; }
    .bar-fill { height: 100%; background: var(--green); }

    /* Modal & Danger Box & Toast */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(17, 24, 39, 0.45);
      display: none; align-items: center; justify-content: center; padding: 12px; z-index: 100;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #fff; width: 100%; max-width: 620px; max-height: 92vh;
      overflow-y: auto; padding: 16px; border: 1px solid var(--border);
    }
    .modal-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border-light);
    }
    .close-x { border: 1px solid var(--border); background: #fff; width: 24px; height: 24px; cursor: pointer; font-size: 15px; color: var(--muted); }
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #f9fafb; border: 1px solid var(--border-light); padding: 8px 10px; margin-bottom: 10px;
    }
    .info-grid span { display: block; font-size: 10.5px; color: var(--muted); }
    .danger-box {
      border: 1px solid #f6b8b3;
      background: #fffafa;
      padding: 10px;
      margin-top: 10px;
    }
    .warn-box {
      border: 1px solid #f3d098;
      background: #fffdf7;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 11.5px;
      color: #7c4a03;
    }
    .form-grid-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .form-field { margin-bottom: 8px; }
    .form-field label { display: block; font-size: 11px; font-weight: 700; color: #374151; margin-bottom: 3px; }
    .toast {
      position: fixed; bottom: 16px; right: 16px; background: #111827; color: #fff;
      padding: 8px 14px; font-size: 12px; font-weight: 600; display: none; z-index: 200;
    }
    .toast.show { display: block; }

    .print-only { display: none; }

    @media (max-width: 1140px) {
      .utility-bar { flex-wrap: wrap; }
    }

    @media (max-width: 1024px) {
      .dash-grid, .quotas-grid, .kpi-strip, .info-grid, .blocks-grid { grid-template-columns: 1fr; }
      .sticky-panel { position: static; }
      .kpi-cell { border-right: none; border-bottom: 1px solid var(--border-light); }
    }

    @media print {
      .utility-bar, .nav-bar, .toolbar, .btn, .modal-bg, .toast, .no-print, .breadcrumbs, .page-desc { display: none !important; }
      .print-only { display: block !important; }
      .site-header { border-bottom: 2px solid #000; padding: 4px 0 8px; }
      .main { padding: 8px 0; }
      .panel { border: 1px solid #999; break-inside: avoid; }
      .quotas-grid, .dash-grid { grid-template-columns: 1fr; }
      th, td { font-size: 11px; padding: 4px 6px; }
      .print-signatures {
        margin-top: 24px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        font-size: 12px;
        break-inside: avoid;
      }
      .sig-line {
        border-bottom: 1px solid #111;
        height: 22px;
        margin-top: 14px;
      }
    }
  </style>
</head>
<body>

<div class="utility-bar">
  <div class="utility-left">
    <span class="accent">УЦР и Дирекция студгородка НГТУ</span>
    <select id="dormSelect" class="ctx-select" title="Выбор общежития">
      <option value="dorm6">Общежитие № 6 (ул. Блюхера, 32/1 · АВТФ · 734 места)</option>
      <option value="dorm1">Общежитие № 1 (пр. К. Маркса, 37 · РЭФ · 458 мест)</option>
      <option value="dorm2">Общежитие № 2 (пр. К. Маркса, 33 · ФГО · 314 мест)</option>
      <option value="dorm3">Общежитие № 3 (ул. Космическая, 21 · МТФ · 388 мест)</option>
      <option value="dorm4">Общежитие № 4 (ул. Геодезическая, 2 · ФМА · 369 мест)</option>
      <option value="dorm5">Общежитие № 5 (ул. Блюхера, 30/1 · ФБ/ФЛА · 586 мест)</option>
      <option value="dorm7">Общежитие № 7 (ул. Космическая, 21/1 · ФЭН/ФПМИ/ФТФ · 954 места)</option>
      <option value="dorm8">Общежитие № 8 (ул. Немировича-Данченко, 138 · Маг./Асп. · 250 мест)</option>
      <option value="dorm9">Общежитие № 9 (ул. Б. Хмельницкого, 7 · ФГО/ИСТ · 154 места)</option>
      <option value="dorm10">Общежитие № 10 (ул. Немировича-Данченко, 136/1 · Высокобалльники / отличники · 480 мест)</option>
      <option value="opk">ОПК (ул. Блюхера, 32/1 · 205 мест)</option>
    </select>
    <select id="floorSelect" class="ctx-select" title="Выбор этажа">
      <option value="1">1-й этаж</option>
      <option value="2">2-й этаж</option>
      <option value="3">3-й этаж (пилот)</option>
      <option value="4">4-й этаж</option>
      <option value="5">5-й этаж</option>
      <option value="6">6-й этаж</option>
      <option value="7">7-й этаж</option>
      <option value="8">8-й этаж</option>
      <option value="9">9-й этаж</option>
    </select>
  </div>

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function pluralRu(n, forms) {
  const abs = Math.abs(n) % 100;
  const n1 = abs % 10;
  if (abs > 10 && abs < 20) return forms[2];
  if (n1 > 1 && n1 < 5) return forms[1];
  if (n1 === 1) return forms[0];
  return forms[2];
}
function formatShortName(fio) {
  const p = String(fio ?? '').trim().split(/\s+/);
  if (p.length >= 3) return `${p[0]} ${p[1][0]}.${p[2][0]}.`;
  if (p.length === 2) return `${p[0]} ${p[1][0]}.`;
  return p[0] || '';
}

/* ================= DATE MASK (ДД.ММ.20ГГ) ================= */
const DATE20_TEMPLATE = '__.__.20__';
const DATE20_SLOTS = [0, 1, 3, 4, 8, 9];

function onDate20Focus(el) {
  if (!el.value) {
    el.value = DATE20_TEMPLATE;
  }
  const firstEmpty = DATE20_SLOTS.find(i => el.value[i] === '_');
  const pos = firstEmpty !== undefined ? firstEmpty : 10;
  requestAnimationFrame(() => el.setSelectionRange(pos, pos));
}

function onDate20Blur(el) {
  if (el.value === DATE20_TEMPLATE) {
    el.value = '';
  }
}

function onDate20KeyDown(e, el) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key;
  if (['Tab', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(key)) return;

  let chars = (el.value && el.value.length === 10 ? el.value : DATE20_TEMPLATE).split('');
  const selStart = el.selectionStart ?? 0;
  const selEnd = el.selectionEnd ?? selStart;

  if (key === 'Backspace') {
    e.preventDefault();
    if (selEnd > selStart) {
      DATE20_SLOTS.forEach(i => { if (i >= selStart && i < selEnd) chars[i] = '_'; });
      el.value = chars.join('');
      const firstSlot = DATE20_SLOTS.find(i => i >= selStart) ?? 0;
      el.setSelectionRange(firstSlot, firstSlot);
      return;
    }
    const prevSlot = [...DATE20_SLOTS].reverse().find(i => i < selStart);
    if (prevSlot !== undefined) {
      chars[prevSlot] = '_';
      el.value = chars.join('');
      el.setSelectionRange(prevSlot, prevSlot);
    }
    return;
  }

  if (key === 'Delete') {
    e.preventDefault();
    if (selEnd > selStart) {
      DATE20_SLOTS.forEach(i => { if (i >= selStart && i < selEnd) chars[i] = '_'; });
      el.value = chars.join('');
      const firstSlot = DATE20_SLOTS.find(i => i >= selStart) ?? 0;
      el.setSelectionRange(firstSlot, firstSlot);
      return;
    }
    const curSlot = DATE20_SLOTS.find(i => i >= selStart);
    if (curSlot !== undefined) {
      chars[curSlot] = '_';
      el.value = chars.join('');
      el.setSelectionRange(curSlot, curSlot);
    }
    return;
  }

  if (/^\d$/.test(key)) {
    e.preventDefault();
    if (selEnd > selStart) {
      DATE20_SLOTS.forEach(i => { if (i >= selStart && i < selEnd) chars[i] = '_'; });
    }
    const targetSlot = DATE20_SLOTS.find(i => i >= selStart);
    if (targetSlot !== undefined) {
      chars[targetSlot] = key;
      el.value = chars.join('');
      const nextSlot = DATE20_SLOTS.find(i => i > targetSlot);
      const nextPos = nextSlot !== undefined ? nextSlot : 10;
      el.setSelectionRange(nextPos, nextPos);
    }
    return;
  }

  e.preventDefault();
}

function onDate20Paste(e, el) {
  e.preventDefault();
  const pasted = (e.clipboardData || window.clipboardData).getData('text') || '';
  const digits = pasted.replace(/\D/g, '');
  if (!digits) return;
  // Поддержка вставки как ДДММ20ГГ (8 цифр), так и ДДММГГ (6 цифр)
  const six = (digits.length >= 8 && digits.slice(4, 6) === '20')
    ? digits.slice(0, 4) + digits.slice(6, 8)
    : digits.slice(0, 6);
  let chars = DATE20_TEMPLATE.split('');
  for (let idx = 0; idx < six.length && idx < DATE20_SLOTS.length; idx++) {
    chars[DATE20_SLOTS[idx]] = six[idx];
  }
  el.value = chars.join('');
  const nextSlot = DATE20_SLOTS.find(i => el.value[i] === '_');
  const pos = nextSlot !== undefined ? nextSlot : 10;
  el.setSelectionRange(pos, pos);
}

function parseDate20Value(rawVal) {
  const v = (rawVal || '').trim();
  if (!v || v === DATE20_TEMPLATE) return { status: 'empty', value: '' };
  const m = v.match(/^(\d{2})\.(\d{2})\.(20\d{2})$/);
  if (!m) return { status: 'incomplete', value: v };
  const dd = Number(m[1]);
  const mm = Number(m[2]);
  const yyyy = Number(m[3]);
  const dt = new Date(yyyy, mm - 1, dd);
  if (mm < 1 || mm > 12 || dd < 1 || dt.getFullYear() !== yyyy || dt.getMonth() !== mm - 1 || dt.getDate() !== dd) {
    return { status: 'invalid', value: v };
  }
  return { status: 'ok', value: v };
}

/* ================= ACADEMIC WEEK CALCULATION ================= */
function getAcademicWeekInfo(now = new Date()) {
  const y = now.getFullYear();
  const m = now.getMonth();
  const todayMidnight = new Date(y, m, now.getDate());
  const dateStr = todayMidnight.toLocaleDateString('ru-RU');

  if (m >= 8) {
    const sept1 = new Date(y, 8, 1);
    const shift = (sept1.getDay() + 6) % 7;
    const week1Mon = new Date(y, 8, 1 - shift);
    const week = Math.floor((todayMidnight - week1Mon) / 604800000) + 1;
    return { text: `${week} учебная неделя`, title: `Осенний семестр · ${dateStr}` };
  }
  if (m >= 1 && m <= 5) {
    const feb9 = new Date(y, 1, 9);
    const shift = (feb9.getDay() + 6) % 7;
    const week1Mon = new Date(y, 1, 9 - shift);
    const week = Math.max(1, Math.floor((todayMidnight - week1Mon) / 604800000) + 1);
    return { text: `${week} учебная неделя`, title: `Весенний семестр · ${dateStr}` };
  }
  return {
    text: m === 0 ? 'Зимняя сессия' : 'Летний период',
    title: `Календарная дата: ${dateStr}`
  };
}

function updateWeekBadge() {
  const el = document.getElementById('weekBadge');
  if (!el) return;
  const info = getAcademicWeekInfo();
  el.textContent = info.text;
  el.title = info.title;
}

/* ================= CORE INVENTORY & QUOTA MATH ================= */
function getRoom(id) { return state.rooms.find(r => r.id === id); }
function getRoomOccupants(id) { return state.students.filter(s => s.roomId === id); }

function getReadyFreeBeds(r) {
  if (r.condition !== 'Норма') return 0;
  return Math.max(0, r.capacity - getRoomOccupants(r.id).length);
}

function getRepairUnavailBeds(r) {
  if (r.condition === 'Норма') return 0;
  return Math.max(0, r.capacity - getRoomOccupants(r.id).length);
}

function getFloorBalance(facultyFilter = null) {
  const rooms = facultyFilter ? state.rooms.filter(r => r.quotaTag === facultyFilter) : state.rooms;
  const total = rooms.reduce((a, r) => a + r.capacity, 0);
  const occupied = rooms.reduce((a, r) => a + getRoomOccupants(r.id).length, 0);
  const readyFreeM = rooms.filter(r => r.gender === 'М').reduce((a, r) => a + getReadyFreeBeds(r), 0);
  const readyFreeF = rooms.filter(r => r.gender === 'Ж').reduce((a, r) => a + getReadyFreeBeds(r), 0);
  const readyFree = readyFreeM + readyFreeF;
  const repairUnavailM = rooms.filter(r => r.gender === 'М').reduce((a, r) => a + getRepairUnavailBeds(r), 0);
  const repairUnavailF = rooms.filter(r => r.gender === 'Ж').reduce((a, r) => a + getRepairUnavailBeds(r), 0);
  const repairUnavail = repairUnavailM + repairUnavailF;
  return { total, occupied, readyFree, readyFreeM, readyFreeF, repairUnavail, repairUnavailM, repairUnavailF };
}

function getFacultyList() {
  const order = ['АВТФ', 'ЦМО (Иностранцы)', 'ФПМИ', 'ФЭН'];
  const names = [...new Set([...order, ...state.rooms.map(r => r.quotaTag)])];
  return names.map(name => {
    const bal = getFloorBalance(name);
    const apps = state.applications.filter(a => a.faculty === name).length;
    return {
      name,
      quota: bal.total,
      occupied: bal.occupied,
      readyFree: bal.readyFree,
      readyFreeM: bal.readyFreeM,
      readyFreeF: bal.readyFreeF,
      repairUnavail: bal.repairUnavail,
      apps,
      note: (state.facultyNotes && state.facultyNotes[name]) || 'Закреплённый фонд этажа'
    };
  });
}

function isBlockHealthy(blockName) {

function isRisk(s) {

function isGraduating(s) {

function getBenefits(obj) {
  return Array.isArray(obj.benefits) ? obj.benefits : (obj.benefit && obj.benefit !== 'Нет' ? [obj.benefit] : []);
}

function renderBenefitsHtml(obj) {
  const list = getBenefits(obj);
  if (!list.length) return '<span style="color:var(--muted)">—</span>';
  if (list.length === 1) return `<span class="tag t-blue">${esc(list[0])}</span>`;
  return `
    <span class="benefit-multi-wrap" onclick="event.stopPropagation(); this.classList.toggle('open')">
      <button type="button" class="benefit-multi-btn" aria-label="Показать все льготы (${list.length})">
        <span>${esc(list[0])}</span>
        <span class="benefit-multi-count">+${list.length - 1}</span>
      </button>
      <div class="benefit-popover" role="tooltip">
        <div class="benefit-popover-title">Подтверждённые льготы (${list.length}):</div>
        <ul>${list.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      </div>
    </span>`;
}

function getAppPriority(a) {
  const bens = getBenefits(a);
  if (bens.length > 0) return { rank: 1, code: 'benefit', label: '1 · Льготная квота', cls: 't-red' };
  if (a.course === 1 && a.studyMode === 'Очная') return { rank: 2, code: 'first_year', label: '2 · 1 курс (100% резерв)', cls: 't-blue' };
  if (a.studyMode === 'Очная') return { rank: 3, code: 'senior', label: '3 · Старшие курсы', cls: 't-green' };
  return { rank: 4, code: 'extramural', label: '4 · На время сессии', cls: 't-gray' };
}

/* ================= CSV EXPORT ================= */
function downloadCsv(filename, headers, rows) {
  const csvEscape = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [headers.map(csvEscape).join(';')];
  rows.forEach(r => lines.push(r.map(csvEscape).join(';')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Файл выгружен: ' + filename);
}

function getFilteredStudents() {
  const q = state.searchQuery.trim().toLowerCase();
  const list = getVisibleStudents().filter(s => {
    const r = getRoom(s.roomId);
    const hay = `${s.fio} ${s.phone} ${s.group} ${s.faculty} ${s.eduLevel} ${s.studyMode} ${s.contractNo} ${r ? r.number : ''}`.toLowerCase();
    const matchQ = !q || hay.includes(q);
    const matchFac = state.filterFaculty === 'all' || s.faculty === state.filterFaculty;
    const matchLevel = state.filterEduLevel === 'all' || s.eduLevel === state.filterEduLevel;
    const matchMed = state.filterMed === 'all' ||
      (state.filterMed === 'expired' && s.medExpired) ||
      (state.filterMed === 'valid' && !s.medExpired);
    let matchStatus = true;
    if (state.filterStatus === 'Бронь просрочена') {
      matchStatus = s.status === 'Бронь' && s.bookingDaysLeft <= 0;
    } else if (state.filterStatus === 'Бронь') {
      matchStatus = s.status === 'Бронь' && s.bookingDaysLeft > 0;
    } else if (state.filterStatus !== 'all') {
      matchStatus = s.status === state.filterStatus;
    }
    return matchQ && matchFac && matchLevel && matchMed && matchStatus;
  });

  list.sort((a, b) => {
    const rA = getRoom(a.roomId);
    const rB = getRoom(b.roomId);
    const numA = rA ? rA.number : 'ЯЯЯ';
    const numB = rB ? rB.number : 'ЯЯЯ';
    const cmp = numA.localeCompare(numB, 'ru');
    return cmp !== 0 ? cmp : a.fio.localeCompare(b.fio, 'ru');
  });
  return list;
}

function exportStudentsCsv() {
  const list = getFilteredStudents();
  const headers = ['ФИО', 'Телефон', 'Факультет', 'Группа', 'Уровень', 'Курс', 'Форма', 'Основа', 'Комната', 'Блок', 'Льготы', 'Статус', 'Оплата', 'Флюорография', 'Договор'];
  const rows = list.map(s => {
    const r = getRoom(s.roomId);
    const bens = getBenefits(s).join(', ') || 'Нет';
    return [s.fio, s.phone, s.faculty, s.group, s.eduLevel, s.course, s.studyMode, s.studyForm, r ? r.number : '', r ? r.block : '', bens, s.status, s.paymentStatus, s.medCheck, s.contractNo];
  });
  downloadCsv('nstu_dorm6_floor3_students.csv', headers, rows);
}

function getFilteredApps() {
  const q = state.appSearch.trim().toLowerCase();
  let list = getVisibleApps().filter(a => {
    const p = getAppPriority(a);
    const bens = getBenefits(a);
    const hay = `${a.fio} ${a.regNo} ${a.faculty} ${a.group} ${a.eduLevel} ${bens.join(' ')} ${a.appStatus}`.toLowerCase();
    const matchQ = !q || hay.includes(q);
    const matchBenefit =
      state.appBenefitFilter === 'all' ||
      (state.appBenefitFilter === 'yes' && bens.length > 0) ||
      (state.appBenefitFilter === 'no' && bens.length === 0) ||
      bens.includes(state.appBenefitFilter);
    const matchPrio = state.appPriorityFilter === 'all' || p.code === state.appPriorityFilter;
    return matchQ && matchBenefit && matchPrio;
  });

  if (state.appSort === 'priority') {
    list.sort((a, b) => {
      const pa = getAppPriority(a).rank;
      const pb = getAppPriority(b).rank;
      if (pa !== pb) return pa - pb;
      const benDiff = getBenefits(b).length - getBenefits(a).length;
      if (benDiff !== 0) return benDiff;
      if (b.rating !== a.rating) return b.rating - a.rating;
      return a.regNo.localeCompare(b.regNo);
    });
  } else if (state.appSort === 'rating') {
    list.sort((a, b) => b.rating - a.rating);
  } else {
    list.sort((a, b) => a.regNo.localeCompare(b.regNo));
  }
  return list;
}

function exportAppsCsv() {

  const rows = list.map((a, idx) => {

    return [idx + 1, a.regNo, a.fio, a.phone, a.faculty, a.group, a.eduLevel, a.course, a.studyMode, a.studyForm, a.rating, a.gender, bens, p.label, a.appStatus];
  });
  downloadCsv('nstu_dorm6_applications.csv', headers, rows);
}

/* ================= FORECAST (PRORECTOR ROLE) ================= */
function getForecastMetrics() {
  const bal = getFloorBalance();
  const freeM = bal.readyFreeM;
  const freeF = bal.readyFreeF;

  const appsM = state.applications.filter(a => a.gender === 'М').length;
  const appsF = state.applications.filter(a => a.gender === 'Ж').length;

  const reclaimIds = new Set();
  state.students.forEach(s => {
    const r = getRoom(s.roomId);
    if (r && r.condition === 'Авария (ремонт)') return;
    if (s.status.includes('3 дня') || (s.status === 'Бронь' && s.bookingDaysLeft <= 0)) {
      reclaimIds.add(s.id);
    }
  });

  const gradIds = new Set();
  state.students.forEach(s => {
    if (reclaimIds.has(s.id)) return;
    const r = getRoom(s.roomId);
    if (r && r.condition === 'Авария (ремонт)') return;
    if (isGraduating(s)) gradIds.add(s.id);
  });

  const reclaimM = state.students.filter(s => reclaimIds.has(s.id) && s.gender === 'М').length;
  const reclaimF = state.students.filter(s => reclaimIds.has(s.id) && s.gender === 'Ж').length;
  const gradM = state.students.filter(s => gradIds.has(s.id) && s.gender === 'М').length;
  const gradF = state.students.filter(s => gradIds.has(s.id) && s.gender === 'Ж').length;

  const repM = bal.repairUnavailM;
  const repF = bal.repairUnavailF;

  const availM = freeM
    - (state.fcDeductApps ? appsM : 0)
    + (state.fcUseGraduates ? gradM : 0)
    + (state.fcUseReclaim ? reclaimM : 0)
    + (state.fcUseRepair ? repM : 0);

  const availF = freeF
    - (state.fcDeductApps ? appsF : 0)
    + (state.fcUseGraduates ? gradF : 0)
    + (state.fcUseReclaim ? reclaimF : 0)
    + (state.fcUseRepair ? repF : 0);

  return { freeM, freeF, appsM, appsF, gradM, gradF, reclaimM, reclaimF, repM, repF, availM, availF };
}

                <span>+ Юношей (М):</span>
                <input type="range" min="0" max="20" value="${state.forecastMale}" oninput="updateForecastField('forecastMale', Number(this.value))">
                <strong id="fcMaleVal" style="text-align:right">+${state.forecastMale} чел.</strong>
              </div>
              <div class="fc-row">
                <span>+ Девушек (Ж):</span>
                <input type="range" min="0" max="20" value="${state.forecastFemale}" oninput="updateForecastField('forecastFemale', Number(this.value))">
                <strong id="fcFemaleVal" style="text-align:right">+${state.forecastFemale} чел.</strong>
              </div>
              <div class="fc-checks">
                <div style="font-weight:700;color:var(--muted);font-size:10.5px;text-transform:uppercase;margin-bottom:2px;">Учёт текущих обязательств и резервов:</div>
                <label>
                  <input type="checkbox" ${state.fcDeductApps ? 'checked' : ''} onchange="updateForecastField('fcDeductApps', this.checked)">
                  <span>Вычесть текущую очередь заявлений из ЛК (${state.applications.length} шт.): <b>−${fm.appsM} М / −${fm.appsF} Ж</b></span>
                </label>
                <label>
                  <input type="checkbox" ${state.fcUseReclaim ? 'checked' : ''} onchange="updateForecastField('fcUseReclaim', this.checked)">
                  <span>Оперативный возврат (просроч. брони и выселения за 3 дн.): <b>+${fm.reclaimM} М / +${fm.reclaimF} Ж</b></span>

                  <input type="checkbox" ${state.fcUseGraduates ? 'checked' : ''} onchange="updateForecastField('fcUseGraduates', this.checked)">

                </label>
                <label>
                  <input type="checkbox" ${state.fcUseRepair ? 'checked' : ''} onchange="updateForecastField('fcUseRepair', this.checked)">
                  <span>Ввод всех мест после ремонта и аварии (303А, 303Б, 306Б): <b>+${fm.repM} М / +${fm.repF} Ж</b></span>
                </label>
              </div>
              <div id="forecastBox">${buildForecastHtml()}</div>
            </div>
          </div>
        </div>
      </div>`;
  }

  const rightTopPanel = `
    <div class="panel">
      <div class="panel-head">
        <span>Оперативка: активные заявки АХЧ и медосмотр</span>
        <button class="btn btn-outline btn-xs" onclick="switchTab('repairs')">Все ремонты</button>
      </div>
      <div class="panel-body" style="padding:0;">
        ${problemRooms.map(r => `
          <div class="act-row act-row-clickable ${r.condition === 'Авария (ремонт)' ? 'prio-red' : 'prio-amber'}" title="Нажмите, чтобы открыть полную карточку заявки АХЧ" onclick="openRepairModal('${r.id}')">
            <div>
              <strong>Комн. ${esc(r.number)}</strong> · <span style="color:var(--muted)">${esc(r.ticketNo || 'Без номера')}</span>
              <div style="font-size:11px;color:#374151">${esc(r.repairNote)}</div>
            </div>
            <div style="text-align:right;white-space:nowrap;">
              ${condTag(r.condition)}
              <div style="font-size:10.5px;color:var(--muted);margin-top:2px;">до ${esc(r.repairDue || '—')}</div>
              <div class="act-row-cue">Подробнее →</div>
            </div>
          </div>
        `).join('')}
        <div class="act-row act-row-clickable" style="background:#f9fafb;" onclick="goCheckMed()">
          <span style="font-size:11.5px;">Контроль флюорографии ${isDean ? 'по АВТФ ' : ''}(п. 2.3): просрочено или нет справки у <b>${medIssues} чел.</b></span>
          <button class="btn btn-outline btn-xs" onclick="event.stopPropagation(); goCheckMed()">Проверить</button>
        </div>
      </div>
    </div>`;

  return `
    <div class="breadcrumbs">Главная · Кампус и общежития · Общежитие № 6 · Этаж 3 · Сводка и активности</div>
    <div class="page-header">
      <div>
        <h1 class="page-title">Сводка и оперативные активности (Общежитие № 6, этаж 3)</h1>
        <div class="page-desc">${
          isDean ? 'Контур деканата АВТФ: показаны квота, студенты и сигналы вашего факультета' :
          'Операционный контур дирекции студгородка и коменданта'
        }</div>
      </div>
    </div>

    ${kpiHtml}

    <div class="dash-grid">
      <div class="panel">
        <div class="panel-head">
          <span>Оперативные сигналы и задачи к отработке</span>
          <span class="tag t-purple">${risks.length} активных</span>
        </div>
        <div class="scroll-box">
          ${risks.length === 0 ? '<div class="panel-body" style="color:var(--muted)">Критических сигналов нет.</div>' : `
          <table>
            <thead><tr><th>Студент / Контакт</th><th>Комн.</th><th>Статус и причина</th><th style="text-align:right">Действие</th></tr></thead>
            <tbody>
              ${risks.map(s => {
                const r = getRoom(s.roomId);
                return `<tr class="row-link" onclick="openStudentModal('${s.id}')">
                  <td>
                    <strong>${esc(s.fio)}</strong>
                    <div style="font-size:11px;color:var(--muted)">${esc(s.faculty)} · ${esc(s.eduLevel)} ${s.course} к. · ${esc(s.phone)}</div>
                  </td>
                  <td><strong>${r ? esc(r.number) : '—'}</strong></td>
                  <td>${statusTag(s)}<div style="font-size:11px;color:var(--muted);margin-top:2px;">${esc(s.notes || '')}</div></td>
                  <td style="text-align:right"><button class="btn btn-outline btn-xs" onclick="event.stopPropagation(); openStudentModal('${s.id}')">Открыть</button></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`}
        </div>
      </div>

      <div>
        ${rightTopPanel}

        <div class="panel">
          <div class="panel-head">
            <span>Журнал активностей и изменений</span>
            <span class="tag t-gray">${state.logs.length} записей</span>
          </div>
          <div class="scroll-box" style="max-height:240px;">
            ${state.logs.map(l => `
              <div class="act-row">
                <div>
                  <span style="color:var(--muted);font-size:11px;font-weight:700">${esc(l.time)}</span>
                  <span class="tag t-gray" style="margin:0 4px;">${esc(l.actor)}</span>
                  <span>${esc(l.text)}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>`;
}

/* ================= SEARCH ================= */
function renderSearch() {
  const visStud = getVisibleStudents();
  const facs = [...new Set(visStud.map(s => s.faculty))];
  const levels = [...new Set(visStud.map(s => s.eduLevel))];
  const statusOptions = ['Проживает', 'Бронь', 'Бронь просрочена', 'Задолженность', 'К выселению (3 дня)', 'Не ночует >14 дн.'];
  return `
    <div class="breadcrumbs">Главная · Кампус и общежития · Общежитие № 6 · Этаж 3 · Поиск проживающего</div>
    <div class="print-only" style="margin-bottom:8px;">
      <strong>НГТУ НЭТИ · Общежитие № 6 (ул. Блюхера, 32/1), 3-й этаж — Реестр проживающих</strong>
    </div>
    <div class="page-header">
      <div>
        <h1 class="page-title">Реестр и поиск проживающих</h1>
        <div class="page-desc">${state.role === 'dean' ? 'Контур деканата АВТФ: показаны только студенты АВТФ' : 'Единый реестр жильцов общежития'}</div>
      </div>
      <div style="display:flex;gap:6px;" class="no-print">
        <button class="btn btn-outline" onclick="exportStudentsCsv()">Выгрузить в Excel (.csv)</button>
        <button class="btn btn-outline" onclick="window.print()">Печать списка</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-body">
        <div class="toolbar no-print">
          <input class="input input-grow" placeholder="Поиск по ФИО, телефону, группе, комнате или № договора..." value="${esc(state.searchQuery)}" oninput="state.searchQuery=this.value; saveState(); document.getElementById('searchRows').innerHTML=buildSearchRows();">
          ${state.role !== 'dean' ? `
          <select class="select" onchange="state.filterFaculty=this.value; saveState(); document.getElementById('searchRows').innerHTML=buildSearchRows();">
            <option value="all">Все факультеты</option>
            ${facs.map(f => `<option value="${esc(f)}" ${state.filterFaculty===f?'selected':''}>${esc(f)}</option>`).join('')}
          </select>` : ''}
          <select class="select" onchange="state.filterEduLevel=this.value; saveState(); document.getElementById('searchRows').innerHTML=buildSearchRows();">
            <option value="all">Все уровни</option>
            ${levels.map(lv => `<option value="${esc(lv)}" ${state.filterEduLevel===lv?'selected':''}>${esc(lv)}</option>`).join('')}
          </select>
          <select class="select" onchange="state.filterStatus=this.value; saveState(); document.getElementById('searchRows').innerHTML=buildSearchRows();">
            <option value="all" ${state.filterStatus==='all'?'selected':''}>Все статусы</option>
            ${statusOptions.map(st => `<option value="${esc(st)}" ${state.filterStatus===st?'selected':''}>${esc(st)}</option>`).join('')}
          </select>
          <select class="select" onchange="state.filterMed=this.value; saveState(); document.getElementById('searchRows').innerHTML=buildSearchRows();">
            <option value="all" ${state.filterMed==='all'?'selected':''}>ФЛГ: все</option>
            <option value="expired" ${state.filterMed==='expired'?'selected':''}>ФЛГ: просрочена / нет</option>
            <option value="valid" ${state.filterMed==='valid'?'selected':''}>ФЛГ: действует</option>
          </select>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Комн.</th>
                <th>ФИО и телефон</th>
                <th>Фак. / Группа</th>
                <th>Уровень / Курс / Форма</th>
                <th>Оплата и медосмотр</th>
                <th>Статус</th>
                <th>Договор</th>
                <th class="no-print" style="text-align:right">Карточка</th>
              </tr>
            </thead>
            <tbody id="searchRows">${buildSearchRows()}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

function buildSearchRows() {
  const list = getFilteredStudents();
  if (!list.length) return '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:16px;">Записи не найдены</td></tr>';
  return list.map(s => {
    const r = getRoom(s.roomId);
    const payHtml = s.paymentDebt > 0
      ? `<span class="tag t-purple">${esc(s.paymentStatus)}</span>`
      : `<span style="color:#374151">${esc(s.paymentStatus)}</span>`;
    const medHtml = s.medExpired
      ? `<span class="tag t-amber">ФЛГ: ${esc(s.medCheck)}</span>`
      : `<span style="color:var(--muted)">ФЛГ: ${esc(s.medCheck)}</span>`;
    const bens = getBenefits(s);
    return `<tr class="row-link" title="Нажмите, чтобы открыть карточку проживающего" onclick="openStudentModal('${s.id}')">
      <td><strong>${r ? esc(r.number) : '—'}</strong><div style="font-size:10.5px;color:var(--muted)">${r ? esc(r.block) : ''}</div></td>
      <td><strong>${esc(s.fio)}</strong><div style="font-size:11px;color:var(--muted)">${esc(s.phone)}</div></td>
      <td>${esc(s.faculty)} · ${esc(s.group)}${bens.length ? `<div style="margin-top:2px;">${renderBenefitsHtml(s)}</div>` : ''}</td>
      <td>${esc(s.eduLevel)}, <b>${s.course} к.</b><div style="font-size:11px;color:var(--muted)">${esc(s.studyMode)} · ${esc(s.studyForm)} · рейт. ${s.rating}</div></td>
      <td><div style="font-size:11px;">${payHtml}</div><div style="font-size:10.5px;margin-top:2px;">${medHtml}</div></td>
      <td>${statusTag(s)}</td>
      <td style="color:var(--muted);white-space:nowrap;">${esc(s.contractNo)}</td>
      <td class="no-print" style="text-align:right;white-space:nowrap;"><span class="row-open-cue">Открыть →</span></td>
    </tr>`;
  }).join('');
}

/* ================= FLOOR MAP ================= */
function renderMap() {
  const isDean = state.role === 'dean';
  const isProrector = state.role === 'prorector';
  const blocks = [...new Set(state.rooms.map(r => r.block))];

  const subtitle = isDean
    ? 'Контур деканата АВТФ: нажмите на комнату вашего факультета для просмотра жильцов'
    : isProrector
    ? 'Обзор заполняемости и технического состояния жилых блоков этажа'
    : 'Жилые блоки этажа (п. 8.3). Нажмите на комнату для просмотра жильцов и управления состоянием';

  return `
    <div class="breadcrumbs">Главная · Кампус и общежития · Общежитие № 6 · Этаж 3 · Карта этажа</div>
    <div class="page-header">
      <div>
        <h1 class="page-title">Карта 3-го этажа (Общежитие № 6)</h1>
        <div class="page-desc">${subtitle}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:11px;align-items:center;">
        <span class="tag t-green">Свободно (готово)</span>
        <span class="tag t-gray">Проживает</span>
        <span class="tag t-amber">Бронь</span>
        <span class="tag t-purple">Риск жильца</span>
        <span class="tag t-red">Ремонт / Авария</span>
        ${isDean ? '<span class="tag t-blue">Квота АВТФ</span>' : ''}
      </div>
    </div>
    <div class="blocks-grid">
      ${blocks.map(bName => {
        const bRooms = state.rooms.filter(r => r.block === bName);
        const hasIssue = bRooms.some(r => r.condition !== 'Норма');
        const relevantRooms = isDean ? bRooms.filter(r => r.quotaTag === 'АВТФ') : bRooms;
        const cap = relevantRooms.reduce((a, r) => a + r.capacity, 0);
        const free = relevantRooms.reduce((a, r) => a + getReadyFreeBeds(r), 0);
        const blockBadgeText = isDean
          ? (cap > 0 ? `Своб. АВТФ: ${free}/${cap}` : 'Квота других фак.')
          : `Своб. (готово): ${free}/${cap}`;

        return `<div class="block-card ${hasIssue ? 'has-issue' : ''}">
          <div class="block-top">
            <div><strong>${esc(bName)}</strong> <span style="color:var(--muted)">(${bRooms[0].gender})</span></div>
            <span class="tag ${free > 0 ? 't-green' : 't-gray'}">${blockBadgeText}</span>
          </div>
          <div class="rooms-grid">
            ${bRooms.map(r => {
              const occ = getRoomOccupants(r.id);
              const fr = getReadyFreeBeds(r);
              const isOtherFacForDean = isDean && r.quotaTag !== 'АВТФ';
              let bedsHtml = '';

              occ.forEach(s => {
                if (isOtherFacForDean || (isDean && s.faculty !== 'АВТФ')) {
                  bedsHtml += `<div class="bed bed-anon" title="Персональные данные скрыты (квота ${esc(r.quotaTag)})">Занято · ${esc(r.quotaTag)}</div>`;
                  return;
                }
                let cls = 'bed-occ';
                let suffix = '';
                if (s.status === 'Бронь') {
                  cls = s.bookingDaysLeft <= 0 ? 'bed-risk' : 'bed-book';
                  suffix = s.bookingDaysLeft <= 0 ? ' (проср.)' : ' (бронь)';
                } else if (s.status !== 'Проживает') {
                  cls = 'bed-risk';
                }
                const shortName = formatShortName(s.fio);
                bedsHtml += `<div class="bed ${cls}" title="${esc(s.fio)} — ${esc(s.eduLevel)} ${s.course} к. (${esc(s.status)})">${esc(shortName + suffix)}</div>`;
              });

              for (let i = 0; i < r.capacity - occ.length; i++) {
                if (r.condition === 'Авария (ремонт)') {
                  bedsHtml += '<div class="bed bed-rep">Закрыто (авария)</div>';
                } else if (r.condition === 'Требует ремонта') {
                  bedsHtml += '<div class="bed bed-rep">Резерв (ремонт)</div>';
                } else if (isOtherFacForDean) {
                  bedsHtml += `<div class="bed bed-anon">Квота ${esc(r.quotaTag)}</div>`;
                } else {
                  bedsHtml += '<div class="bed bed-free">Свободно</div>';
                }
              }

              const cardClasses = [
                'room-card',
                r.condition !== 'Норма' ? 'is-repair' : (!isOtherFacForDean && fr > 0 ? 'is-free' : ''),
                isOtherFacForDean ? 'is-other-fac' : ''
              ].filter(Boolean).join(' ');

              const clickAttr = isOtherFacForDean ? '' : `onclick="openRoomModal('${r.id}')"`;
              const quotaBadge = (isDean && r.quotaTag === 'АВТФ')
                ? `<span class="tag t-blue" style="font-size:10px;padding:0 4px;">АВТФ</span>`
                : `<span style="font-size:10.5px;color:var(--muted)">${esc(r.quotaTag)}</span>`;

              return `<div class="${cardClasses}" ${clickAttr}>
                <div class="room-head"><span>${esc(r.number)}</span><span style="color:var(--muted)">${occ.length}/${r.capacity}</span></div>
                <div class="beds">${bedsHtml}</div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:4px;">
                  ${quotaBadge}
                  ${r.condition !== 'Норма' ? condTag(r.condition) : ''}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

/* ================= REPAIRS ================= */
function renderRepairs() {

  const isProrector = state.role === 'prorector';

              ${canEdit ? '<th class="no-print" style="text-align:right">Действия</th>' : ''}

          </thead>

                    return `<div><strong>${esc(formatShortName(s.fio))}</strong> <span style="color:var(--muted)">(${esc(s.group)})</span></div>`;
                  }).join('');

              return `<tr class="row-link" title="Нажмите, чтобы открыть карточку заявки АХЧ" onclick="openRepairModal('${r.id}')">
                <td><strong>${esc(r.number)}</strong> <span style="color:var(--muted)">(${esc(r.block)}, ${esc(r.gender)}, ${esc(r.quotaTag)})</span></td>
                <td><span class="tag t-gray">${esc(r.ticketNo || '—')}</span></td>
                <td>${condTag(r.condition)}</td>
                <td>${esc(r.repairNote || '—')}</td>

          </tbody>

      </div>

/* ================= QUOTAS & APPLICATIONS ================= */
function buildAppRows() {
  const canAssign = state.role === 'directorate' || state.role === 'dean';
  const list = getFilteredApps();
  const cntEl = document.getElementById('appsFilteredCount');
  if (cntEl) cntEl.textContent = list.length;

  if (!list.length) {
    return `<tr><td colspan="${canAssign ? 7 : 6}" style="text-align:center;color:var(--muted);padding:18px;">По выбранным фильтрам заявлений не найдено.</td></tr>`;
  }

  return list.map((a, idx) => {
    const p = getAppPriority(a);
    const isRevision = a.appStatus === 'На доработке';
    const statusBadge = isRevision
      ? `<div style="margin-top:3px;"><span class="tag t-amber">На доработке</span> <span style="font-size:11px;color:var(--muted)">${esc(a.reviewComment)}</span></div>`
      : '';
    const assignTitle = isRevision
      ? 'Недоступно: заявление возвращено на доработку (неполный пакет документов)'
      : (state.role === 'dean' ? 'Выдать направление в общежитие (бронь 10 дн.)' : 'Выдать бронь и назначить комнату');

    return `<tr>
      <td style="color:var(--muted);font-weight:700;white-space:nowrap;">#${idx + 1}</td>
      <td style="color:var(--muted);white-space:nowrap;">${esc(a.regNo)}</td>
      <td>
        <strong>${esc(a.fio)}</strong>
        <div style="font-size:11px;color:var(--muted)">${esc(a.faculty)} · ${esc(a.group)} · пол: ${a.gender} · ${esc(a.phone)}</div>
        ${statusBadge}
      </td>
      <td>
        ${esc(a.eduLevel)}, <b>${a.course} к.</b>
        <div style="font-size:11px;color:var(--muted)">${esc(a.studyMode)} (${esc(a.studyForm)}) · рейт. ${a.rating}</div>
      </td>
      <td>${renderBenefitsHtml(a)}</td>
      <td><span class="tag ${p.cls}">${p.label}</span></td>
      ${canAssign ? `<td class="no-print" style="text-align:right;">
        <div class="app-actions-stack">
          <button class="btn btn-primary btn-xs" ${isRevision ? 'disabled' : ''} title="${esc(assignTitle)}" onclick="openAssignModal('${a.id}')">${state.role === 'dean' ? 'Направление' : 'Заселить'}</button>
          <button class="btn btn-outline btn-xs" onclick="openAppReviewModal('${a.id}', 'revision')">На доработку</button>
          <button class="btn btn-danger-outline btn-xs" onclick="openAppReviewModal('${a.id}', 'reject')">Отклонить</button>
        </div>
      </td>` : ''}
    </tr>`;
  }).join('');
}

  const occBlock = occ.length === 0
    ? '<p style="color:var(--muted);font-size:12px;">В комнате сейчас никто не проживает.</p>'

        if (isDean && s.faculty !== 'АВТФ') {

      <div><span>Фонд комнаты / Выведено мест</span><strong>${r.capacity} мест · выведено: ${unavail}</strong></div>
    </div>
    <div class="act-row ${r.condition === 'Авария (ремонт)' ? 'prio-red' : 'prio-amber'}" style="margin-bottom:10px;border:1px solid #f3d098;">
      <div>

function buildMoveOptions(studentId, includeRepair) {
  const s = state.students.find(x => x.id === studentId);
  if (!s) return '';
  const avail = state.rooms.filter(rm => {
    if (rm.id === s.roomId || rm.gender !== s.gender) return false;
    const free = Math.max(0, rm.capacity - getRoomOccupants(rm.id).length);
    if (free <= 0 || rm.condition === 'Авария (ремонт)') return false;
    if (!includeRepair && rm.condition !== 'Норма') return false;
    return true;
  });
  if (!avail.length) return '<option value="">Нет доступных комнат</option>';
  return avail.map(rm => {
    const free = Math.max(0, rm.capacity - getRoomOccupants(rm.id).length);
    const warn = rm.condition !== 'Норма' ? ' [! ВНИМАНИЕ: Требует ремонта]' : '';
    return `<option value="${rm.id}">Комн. ${esc(rm.number)} (${esc(rm.block)}, своб.: ${free})${warn}</option>`;
  }).join('');
}

function openAssignModal(appId) {
  const a = state.applications.find(x => x.id === appId); if (!a) return;
  if (a.appStatus === 'На доработке') {
    showToast('Заявление на доработке — выдача места заблокирована');
    return;
  }
  const p = getAppPriority(a);
  const isDean = state.role === 'dean';

  const avail = state.rooms
    .filter(r => r.gender === a.gender && r.condition === 'Норма' && getReadyFreeBeds(r) > 0 && (!isDean || r.quotaTag === 'АВТФ'))
    .sort((r1, r2) => {
      const h1 = isBlockHealthy(r1.block) ? 0 : 1;
      const h2 = isBlockHealthy(r2.block) ? 0 : 1;
      if (h1 !== h2) return h1 - h2;
      return r1.number.localeCompare(r2.number, 'ru');
    });

  const modalTitle = isDean
    ? `Выдача направления по заявлению ${esc(a.regNo)}`
    : `Заселение по заявлению ${esc(a.regNo)}`;

  const actionBtnLabel = isDean
    ? 'Выдать направление (бронь 10 дн.)'
    : 'Выдать бронь на 10 дней (п. 3.6)';

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-top">
      <div><h3 style="font-size:15px">${modalTitle}</h3><div style="margin-top:3px"><span class="tag ${p.cls}">${p.label}</span></div></div>
      <button class="close-x" onclick="closeModal()">×</button>
    </div>
    <div class="info-grid">
      <div><span>ФИО / Факультет</span><strong>${esc(a.fio)} (${esc(a.faculty)})</strong></div>
      <div><span>Уровень / Курс / Форма</span><strong>${esc(a.eduLevel)}, ${a.course} к. · ${esc(a.studyMode)}</strong></div>
      <div><span>Телефон / Основа</span><strong>${esc(a.phone)} · ${esc(a.studyForm)}</strong></div>
      <div><span>Пол / Рейтинг / Льготы</span><strong>${a.gender} · ${a.rating} · ${esc(getBenefits(a).join(', ') || 'Нет')}</strong></div>
    </div>
    ${avail.length ? `
      <div class="form-field">
        <label>Выберите комнату (сначала показаны полностью исправные блоки):</label>
        <select id="assignRoomSel" class="select" style="width:100%;" onchange="checkAssignBlockHealth()">
          ${avail.map(r => {
            const healthy = isBlockHealthy(r.block);
            const warn = healthy ? '' : ' [⚠ Внимание: в соседней комнате блока ремонт санузла]';
            return `<option value="${r.id}" data-healthy="${healthy ? '1' : '0'}">Комната ${esc(r.number)} (${esc(r.block)}, квота: ${esc(r.quotaTag)}, своб.: ${getReadyFreeBeds(r)})${warn}</option>`;
          }).join('')}
        </select>
      </div>
      <div id="assignBlockWarn" class="warn-box" style="display:${isBlockHealthy(avail[0].block) ? 'none' : 'block'};">
        <strong>Внимание:</strong> В данном блоке зарегистрирована активная заявка АХЧ (неисправность общего санузла). Рекомендуется выбрать комнату в полностью исправном блоке.
      </div>
      <button class="btn btn-primary" onclick="confirmAssign('${a.id}')">${actionBtnLabel}</button>
    ` : '<div class="act-row prio-red">Нет свободных исправных мест в доступной квоте</div>'}`;
  document.getElementById('modalBackdrop').classList.add('open');
}

function checkAssignBlockHealth() {
  const sel = document.getElementById('assignRoomSel');

  const opt = sel.options[sel.selectedIndex];
  warn.style.display = (opt && opt.dataset.healthy === '0') ? 'block' : 'none';
}

/* ================= ACTIONS ================= */
function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }

function deanRequest(id) {
  const s = state.students.find(x => x.id === id);
  addLog(`Направлен запрос от деканата по студенту ${s.fio} (${s.status})`);
  saveState(); closeModal(); render(); showToast('Запрос передан в Дирекцию студгородка');
}
function confirmResident(id) {
  const s = state.students.find(x => x.id === id);
  const hasUnpaid = s.paymentDebt > 0 || s.paymentStatus.includes('Ожидает оплаты') || s.paymentStatus.includes('Не оплачено');
  if (s.medExpired || hasUnpaid) {
    showToast('Невозможно подтвердить: проверьте ФЛГ и оплату (п. 2.3)');
    return;
  }
  s.status = 'Проживает'; s.bookingDaysLeft = null; s.notes = 'Проживание подтверждено (оплата и ФЛГ проверены)';
  addLog(`Подтверждено проживание: ${s.fio}`); saveState(); closeModal(); render(); showToast('Статус обновлён: Проживает');
}
function confirmMedCheck(id) {
  const s = state.students.find(x => x.id === id);
  s.medExpired = false;
  s.medCheck = 'Действует до 25.11.2027';
  addLog(`Обновлена справка о флюорографии: ${s.fio}`);
  saveState(); openStudentModal(id); showToast('Справка ФЛГ отмечена');
}
function confirmPayment(id) {
  const s = state.students.find(x => x.id === id);
  s.paymentDebt = 0;
  s.paymentStatus = 'Оплачено до 31.12.2026';
  addLog(`Подтверждена оплата проживания: ${s.fio}`);
  saveState(); openStudentModal(id); showToast('Оплата подтверждена');
}
function evictStudent(id) {
  const orderNo = document.getElementById('evictOrderInp').value.trim();
  const reason = document.getElementById('evictReasonSel').value;
  if (!orderNo) {
    showToast('Укажите № приказа или документа-основания!');
    document.getElementById('evictOrderInp').focus();
    return;
  }
  const idx = state.students.findIndex(x => x.id === id);
  const s = state.students[idx]; state.students.splice(idx, 1);
  addLog(`Выселение: ${s.fio} (${reason}, док.: ${orderNo})`);
  saveState(); closeModal(); render(); showToast('Выселение оформлено, место возвращено в фонд');
}
function moveStudent(id) {
  const targetId = document.getElementById('moveRoomSel').value;
  if (!targetId) { showToast('Нет доступной комнаты для переселения'); return; }
  const s = state.students.find(x => x.id === id); const tr = getRoom(targetId);
  s.roomId = targetId; addLog(`Переселение: ${s.fio} -> комн. ${tr.number}`);
  saveState(); closeModal(); render(); showToast(`Переселён в комн. ${tr.number}`);
}
function setRoomCond(id, cond, customReason = '', customMaster = '', customDue = '') {
  const r = getRoom(id); r.condition = cond;
  if (cond === 'Норма') {
    r.repairNote = ''; r.ticketNo = ''; r.repairDue = ''; r.repairMaster = '';
  } else {
    r.repairNote = customReason || r.repairNote || 'Заявка администратора';
    if (!r.ticketNo) r.ticketNo = 'АХЧ-2026-' + (state.ticketSeq++);
    r.repairDue = customDue || r.repairDue || '05.12.2026';
    r.repairMaster = customMaster || r.repairMaster || 'Дежурный мастер АХЧ';
  }
  addLog(`Комната ${r.number}: статус «${cond}»${r.ticketNo ? ' (' + r.ticketNo + ')' : ''}`);
  saveState(); closeModal(); render(); showToast(`Комната ${r.number}: ${cond}`);
}
function confirmRoomCondChange(roomId) {
  const cond = document.getElementById('roomCondTargetVal').value;
  const reason = document.getElementById('rmCondReasonInp').value.trim();
  const master = document.getElementById('rmCondMasterInp').value.trim() || 'Дежурный мастер АХЧ';
  const dueEl = document.getElementById('rmCondDueInp');
  const parsedDue = parseDate20Value(dueEl.value);
  const autoReloc = document.getElementById('rmCondAutoRelocChk')?.checked;

  if (!reason) {
    showToast('Укажите причину неисправности / аварии!');
    document.getElementById('rmCondReasonInp').focus();
    return;
  }
  if (parsedDue.status === 'incomplete' || parsedDue.status === 'invalid') {
    showToast('Введите корректную дату в формате ДД.ММ.20ГГ');
    dueEl.focus();
    return;
  }
  const due = parsedDue.status === 'ok' ? parsedDue.value : '05.12.2026';
  setRoomCond(roomId, cond, reason, master, due);
  if (cond === 'Авария (ремонт)' && autoReloc) {
    autoRelocateRoom(roomId);
  }
}
function markRoomFixed(id) { setRoomCond(id, 'Норма'); }
function submitRepairTicket() {
  const id = document.getElementById('repRoomSel').value;
  const cond = document.getElementById('repCondSel').value;
  const note = document.getElementById('repNoteInp').value.trim();
  const master = document.getElementById('repMasterInp').value.trim() || 'Дежурный мастер АХЧ';
  const dueEl = document.getElementById('repDueInp');
  const parsedDue = parseDate20Value(dueEl.value);
  if (!note) {
    showToast('Укажите причину неисправности!');
    document.getElementById('repNoteInp').focus();
    return;
  }
  if (parsedDue.status === 'incomplete' || parsedDue.status === 'invalid') {
    showToast('Введите корректную дату в формате ДД.ММ.20ГГ');
    dueEl.focus();
    return;
  }
  const due = parsedDue.status === 'ok' ? parsedDue.value : '05.12.2026';
  const r = getRoom(id);
  r.condition = cond;
  r.repairNote = note;
  r.repairMaster = master;
  r.repairDue = due;
  if (!r.ticketNo) r.ticketNo = 'АХЧ-2026-' + (state.ticketSeq++);
  addLog(`Заявка ${r.ticketNo} (комн. ${r.number}, «${cond}», срок ${due}): ${note}`);
  saveState(); render(); showToast(`Оформлена заявка ${r.ticketNo} (комн. ${r.number})`);
}
function autoRelocateRoom(roomId) {
  const r = getRoom(roomId); const occ = getRoomOccupants(roomId);
  let moved = 0;
  occ.forEach(s => {
    const target = state.rooms.find(rm => rm.id !== roomId && rm.condition === 'Норма' && rm.gender === s.gender && getReadyFreeBeds(rm) > 0);
    if (target) { s.roomId = target.id; moved++; addLog(`Экстренное переселение: ${s.fio} (${r.number} -> ${target.number})`); }
  });
  saveState(); render();
  showToast(moved === occ.length ? `Переселены все (${moved} чел.)` : `Переселено ${moved} из ${occ.length}`);
}
function restoreAppFromRevision(appId) {
  const a = state.applications.find(x => x.id === appId);
  a.appStatus = 'На рассмотрении';
  a.reviewComment = '';
  addLog(`Заявление ${a.regNo} (${a.fio}) возвращено в работу после доработки`);
  saveState(); closeModal(); render(); showToast('Заявление допущено к распределению');
}
function sendAppRevision(appId) {
  const a = state.applications.find(x => x.id === appId);
  const reason = document.getElementById('rejectReasonSel').value;
  const note = document.getElementById('rejectNoteInp').value.trim();
  a.appStatus = 'На доработке';
  a.reviewComment = note || reason;
  addLog(`Заявление ${a.regNo} (${a.fio}) возвращено на доработку: ${a.reviewComment}`);
  saveState(); closeModal(); render(); showToast('Заявление отправлено на доработку в ЛК');
}
function rejectApp(appId) {
  const idx = state.applications.findIndex(x => x.id === appId);
  const a = state.applications[idx];
  const reason = document.getElementById('rejectReasonSel').value;
  const note = document.getElementById('rejectNoteInp').value.trim();
  state.applications.splice(idx, 1);
  addLog(`Отклонено заявление ${a.regNo} (${a.fio}): ${reason}${note ? ' — ' + note : ''}`);
  saveState(); closeModal(); render(); showToast(`Заявление ${a.regNo} отклонено`);
}
function assignToRoom(roomId) { moveAppToRoom(document.getElementById('quickAppSel').value, roomId); closeModal(); }
function confirmAssign(appId) { moveAppToRoom(appId, document.getElementById('assignRoomSel').value); closeModal(); }
function moveAppToRoom(appId, roomId) {
  const idx = state.applications.findIndex(x => x.id === appId);
  const a = state.applications[idx];
  if (!a || a.appStatus === 'На доработке') {
    showToast('Нельзя выдать место: заявление на доработке');
    return;
  }
  const r = getRoom(roomId);
  state.students.push({
    id: 's' + Date.now(), fio: a.fio, phone: a.phone,
    paymentStatus: 'Ожидает оплаты (бронь)', paymentDebt: 0,
    medCheck: 'Предоставить при заезде', medExpired: true,
    faculty: a.faculty, eduLevel: a.eduLevel, course: a.course, studyMode: a.studyMode,
    group: a.group, studyForm: a.studyForm, rating: a.rating,
    gender: a.gender, benefits: getBenefits(a),
    roomId: r.id, status: 'Бронь', bookingDaysLeft: 10,
    contractNo: 'БР-26-' + Math.floor(100 + Math.random() * 899),
    notes: `Заселён по заявлению ${a.regNo} (бронь 10 дней)`
  });
  state.applications.splice(idx, 1);
  addLog(`Выдана бронь: ${a.fio} -> комн. ${r.number}`); saveState(); render(); showToast(`${a.fio}: бронь в комн. ${r.number}`);
}
function transferRoomQuota() {
  const roomId = document.getElementById('transferRoomSel').value;
  const newFac = document.getElementById('transferFacSel').value;
  const r = getRoom(roomId);
  if (!r || r.quotaTag === newFac) {
    showToast('Комната уже закреплена за этим факультетом');
    return;
  }
  const oldFac = r.quotaTag;
  r.quotaTag = newFac;
  addLog(`Перераспределение квоты: комн. ${r.number} (${r.capacity} мест) передана из ${oldFac} в ${newFac}`);
  saveState(); render(); showToast(`Комната ${r.number} передана в квоту ${newFac}`);
}

render();
</script>
</body>
</html>
